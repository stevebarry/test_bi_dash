# Sales dashboard configuration.
# Override the location of this file with the DASHBOARD_CONFIG environment
# variable, and the database password with DB_PASSWORD.

[database]
host = localhost
port = 5432
dbname = test
user = claude
password =
schema = sales
pool_min = 1
pool_max = 5
connect_timeout = 5

[app]
host = 127.0.0.1
port = 5000
debug = false

[logging]
# Every SQL statement run is appended to this file (timestamp, duration,
# row count, SQL and parameters). Relative paths are resolved from this
# file's folder. The file rotates at 5 MB, keeping 3 old copies.
# Leave empty to turn SQL logging off.
sql_log = sql.log
